<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kahut Bank - Masuk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-sm bg-white rounded-3xl shadow-lg p-6 flex flex-col justify-between min-h-[550px]">
        <div>
            <!-- Header Logo Kahut Bank -->
            <div class="flex flex-col items-center mt-4 mb-8">
                <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center shadow-md mb-3">
                    <i class="fa-solid fa-shield-halved text-white text-3xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-800 tracking-tight">Kahut Bank</h1>
                <p class="text-xs text-gray-500 font-medium mt-1">Solusi Finansial Modern</p>
            </div>

            <!-- Tab Switcher (User / Admin) -->
            <div class="bg-gray-100 p-1 rounded-xl flex mb-6">
                <button id="tabUser" onclick="switchRole('user')" class="flex-1 py-2 text-xs font-semibold rounded-lg bg-white text-blue-600 shadow-sm transition-all">Member</button>
                <button id="tabAdmin" onclick="switchRole('admin')" class="flex-1 py-2 text-xs font-semibold rounded-lg text-gray-500 transition-all">Admin</button>
            </div>

            <!-- Form Login -->
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1" id="idLabel">Nomor HP / Email</label>
                    <input type="text" id="usernameInput" required placeholder="08123456789" class="w-full px-4 py-3 text-sm bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-blue-500 focus:bg-white transition-all">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">PIN / Password</label>
                    <input type="password" required placeholder="••••••" maxlength="6" class="w-full px-4 py-3 text-sm bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-blue-500 focus:bg-white transition-all">
                </div>
                <button type="submit" class="w-full py-3.5 bg-blue-600 text-white font-bold rounded-xl shadow-blue-200 shadow-lg hover:bg-blue-700 active:scale-[0.98] transition-all text-sm mt-2">
                    Lanjut
                </button>
            </form>
        </div>

        <div class="text-center text-xs text-gray-400 mt-6">
            &copy; 2026 Kahut Bank Indonesia.
        </div>
    </div>

    <script>
        let currentRole = 'user';

        function switchRole(role) {
            currentRole = role;
            const tabUser = document.getElementById('tabUser');
            const tabAdmin = document.getElementById('tabAdmin');
            const idLabel = document.getElementById('idLabel');
            const usernameInput = document.getElementById('usernameInput');

            if (role === 'admin') {
                tabAdmin.className = "flex-1 py-2 text-xs font-semibold rounded-lg bg-white text-blue-600 shadow-sm transition-all";
                tabUser.className = "flex-1 py-2 text-xs font-semibold rounded-lg text-gray-500 transition-all";
                idLabel.innerText = "Username Admin";
                usernameInput.placeholder = "admin_kahut";
            } else {
                tabUser.className = "flex-1 py-2 text-xs font-semibold rounded-lg bg-white text-blue-600 shadow-sm transition-all";
                tabAdmin.className = "flex-1 py-2 text-xs font-semibold rounded-lg text-gray-500 transition-all";
                idLabel.innerText = "Nomor HP / Email";
                usernameInput.placeholder = "08123456789";
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            if (currentRole === 'admin') {
                window.location.href = '/admin';
            } else {
                window.location.href = '/dashboard';
            }
        }
    </script>
</body>
</html>
