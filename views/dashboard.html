<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahut Bank - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 flex justify-center min-h-screen">
    <div class="w-full max-w-md bg-gray-50 min-h-screen relative pb-20 shadow-xl">
        
        <!-- Header & Saldo -->
        <div class="bg-blue-600 p-5 text-white rounded-b-3xl shadow-md">
            <div class="flex justify-between items-center mb-5">
                <div class="flex items-center space-x-2.5">
                    <div class="w-9 h-9 bg-white rounded-xl flex items-center justify-center p-1">
                        <svg viewBox="0 0 100 100" class="w-full h-full">
                            <path d="M 20,20 Q 50,15 80,20 L 75,55 Q 50,85 20,55 Z" fill="#1d4ed8"/>
                            <path d="M 35,65 Q 55,80 75,30 Q 60,35 45,45 Q 35,55 35,65 Z" fill="#f97316"/>
                        </svg>
                    </div>
                    <div>
                        <p class="text-[10px] text-blue-100">Selamat datang,</p>
                        <h2 id="userName" class="font-bold text-xs">Loading...</h2>
                    </div>
                </div>
                <button onclick="logout()" class="text-[11px] bg-white/10 px-3 py-1 rounded-full hover:bg-white/20">Keluar</button>
            </div>

            <div class="bg-white/10 backdrop-blur-md p-4 rounded-2xl border border-white/20">
                <p class="text-[10px] text-blue-100">Saldo Kahut Pay</p>
                <div class="flex justify-between items-center mt-1">
                    <span id="userBalance" class="text-2xl font-extrabold">Rp 0</span>
                    <button onclick="loadUserData()" class="text-xs bg-amber-500 hover:bg-amber-600 px-3 py-1.5 rounded-lg font-bold">Refresh</button>
                </div>
            </div>
        </div>

        <!-- Tombol Menu Fitur -->
        <div class="px-5 -mt-4">
            <div class="bg-white rounded-2xl p-4 shadow-sm border grid grid-cols-2 gap-3 text-center">
                <button onclick="openModal('BANK')" class="bg-blue-50 text-blue-600 p-3 rounded-xl flex items-center justify-center space-x-2 font-bold text-xs">
                    <i class="fa-solid fa-building-columns text-base"></i>
                    <span>Transfer Bank</span>
                </button>
                <button onclick="openModal('KAHUT')" class="bg-amber-50 text-amber-600 p-3 rounded-xl flex items-center justify-center space-x-2 font-bold text-xs">
                    <i class="fa-solid fa-users text-base"></i>
                    <span>Sesama Kahut</span>
                </button>
            </div>
        </div>

        <!-- Riwayat Transaksi Realtime -->
        <div class="p-5">
            <h3 class="font-bold text-gray-800 text-xs mb-3">Riwayat Transaksi</h3>
            <div id="txList" class="space-y-2.5">
                <!-- Riwayat dimuat dinamis -->
            </div>
        </div>
    </div>

    <!-- Modal Transfer -->
    <div id="transferModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center hidden">
        <div class="bg-white w-full max-w-md rounded-t-3xl p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modalTitle" class="font-bold text-gray-800 text-sm">Kiriman Uang</h3>
                <button onclick="closeModal()" class="text-gray-400 text-xl">&times;</button>
            </div>

            <form onsubmit="execTransfer(event)" class="space-y-3">
                <input type="hidden" id="targetType">

                <div id="bankSelection">
                    <label class="block text-[11px] text-gray-500 mb-1">Pilih Bank</label>
                    <select id="selectedBank" class="w-full px-3 py-2 text-xs bg-gray-50 border rounded-xl">
                        <option value="Bank BCA">Bank BCA</option>
                        <option value="Bank Mandiri">Bank Mandiri</option>
                        <option value="Bank BRI">Bank BRI</option>
                        <option value="Bank BNI">Bank BNI</option>
                    </select>
                </div>

                <div>
                    <label id="targetLabel" class="block text-[11px] text-gray-500 mb-1">Nomor Rekening / HP</label>
                    <input type="text" id="targetNumber" required class="w-full px-3 py-2 text-xs bg-gray-50 border rounded-xl">
                </div>

                <div>
                    <label class="block text-[11px] text-gray-500 mb-1">Nominal (Rp)</label>
                    <input type="number" id="transferAmount" required min="10000" class="w-full px-3 py-2 text-xs bg-gray-50 border rounded-xl">
                </div>

                <button type="submit" class="w-full py-3 bg-blue-600 text-white font-bold text-xs rounded-xl shadow-md hover:bg-blue-700">Kirim Sekarang</button>
            </form>
        </div>
    </div>

    <script>
        const currentUser = JSON.parse(localStorage.getItem('kahutUser'));
        if (!currentUser) window.location.href = '/';

        async function loadUserData() {
            const res = await fetch(`/api/user/${currentUser.id}`);
            const data = await res.json();
            
            document.getElementById('userName').innerText = data.user.name + ` (${data.user.id})`;
            document.getElementById('userBalance').innerText = 'Rp ' + data.user.balance.toLocaleString('id-ID');

            // Render Riwayat
            const txContainer = document.getElementById('txList');
            if(data.transactions.length === 0) {
                txContainer.innerHTML = `<p class="text-xs text-gray-400 text-center py-4">Belum ada transaksi</p>`;
                return;
            }

            txContainer.innerHTML = data.transactions.map(tx => {
                const isOut = tx.sender === currentUser.id;
                return `
                    <div class="bg-white p-3 rounded-2xl border flex justify-between items-center text-xs">
                        <div class="flex items-center space-x-2.5">
                            <div class="w-8 h-8 ${isOut ? 'bg-red-50 text-red-500' : 'bg-green-50 text-green-500'} rounded-xl flex items-center justify-center">
                                <i class="fa-solid ${isOut ? 'fa-arrow-up-right' : 'fa-arrow-down-left'}"></i>
                            </div>
                            <div>
                                <p class="font-bold text-gray-800">${tx.type}</p>
                                <p class="text-[10px] text-gray-400">${isOut ? 'Kirim ke: ' + tx.recipient : 'Dari: ' + tx.sender}</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <span class="font-bold ${isOut ? 'text-red-500' : 'text-green-600'}">${isOut ? '-' : '+'} Rp ${tx.amount.toLocaleString('id-ID')}</span>
                            <p class="text-[9px] text-gray-400">${tx.date.split(',')[0]}</p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openModal(type) {
            document.getElementById('targetType').value = type;
            document.getElementById('transferModal').classList.remove('hidden');
            if(type === 'KAHUT') {
                document.getElementById('bankSelection').classList.add('hidden');
                document.getElementById('modalTitle').innerText = 'Transfer Sesama Kahut';
                document.getElementById('targetLabel').innerText = 'Nomor HP Tujuan Kahut';
            } else {
                document.getElementById('bankSelection').classList.remove('hidden');
                document.getElementById('modalTitle').innerText = 'Transfer ke Bank';
                document.getElementById('targetLabel').innerText = 'Nomor Rekening Bank';
            }
        }

        function closeModal() {
            document.getElementById('transferModal').classList.add('hidden');
        }

        async function execTransfer(e) {
            e.preventDefault();
            const type = document.getElementById('targetType').value;
            const targetType = type === 'KAHUT' ? 'KAHUT' : document.getElementById('selectedBank').value;
            const targetNumber = document.getElementById('targetNumber').value;
            const amount = document.getElementById('transferAmount').value;

            const res = await fetch('/api/transfer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ senderId: currentUser.id, targetType, targetNumber, amount })
            });

            const data = await res.json();
            alert(data.message);
            if(data.success) {
                closeModal();
                loadUserData();
            }
        }

        function logout() {
            localStorage.removeItem('kahutUser');
            window.location.href = '/';
        }

        loadUserData();
    </script>
</body>
</html>
