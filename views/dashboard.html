<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="stylesheet" href="/css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kahut Bank - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>
<script src="/js/app.js"></script>
<body class="bg-gray-100 flex justify-center min-h-screen">
    <!-- Container Utama Tampilan Mobile -->
    <div class="w-full max-w-md bg-gray-50 min-h-screen relative pb-20 shadow-xl">
        
        <!-- Header Atas -->
        <div class="bg-blue-600 p-5 text-white rounded-b-3xl shadow-md">
            <div class="flex justify-between items-center mb-6">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center font-bold border border-white/30">
                        KB
                    </div>
                    <div>
                        <p class="text-xs text-blue-100">Selamat Datang,</p>
                        <h2 class="font-bold text-sm">Wani User</h2>
                    </div>
                </div>
                <a href="/" class="text-white/80 hover:text-white text-xs bg-white/10 px-3 py-1.5 rounded-full border border-white/20">
                    <i class="fa-solid fa-arrow-right-from-bracket mr-1"></i> Keluar
                </a>
            </div>

            <!-- Card Saldo Utama -->
            <div class="bg-white/10 backdrop-blur-md p-4 rounded-2xl border border-white/20">
                <p class="text-xs text-blue-100">Saldo Kahut Pay</p>
                <div class="flex justify-between items-center mt-1">
                    <span class="text-2xl font-extrabold tracking-tight">Rp 12.450.000</span>
                    <button class="bg-amber-500 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow-sm hover:bg-amber-600">
                        + Isi Saldo
                    </button>
                </div>
            </div>
        </div>

        <!-- Menu Utama (4 Tombol Ala DANA) -->
        <div class="px-5 -mt-4">
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 grid grid-cols-4 gap-2 text-center">
                <button onclick="openTransferModal()" class="flex flex-col items-center">
                    <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center text-xl mb-1 active:scale-95 transition-transform">
                        <i class="fa-solid fa-paper-plane"></i>
                    </div>
                    <span class="text-[11px] font-semibold text-gray-700">Kirim</span>
                </button>
                <button class="flex flex-col items-center">
                    <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center text-xl mb-1 active:scale-95 transition-transform">
                        <i class="fa-solid fa-qrcode"></i>
                    </div>
                    <span class="text-[11px] font-semibold text-gray-700">Minta</span>
                </button>
                <button class="flex flex-col items-center">
                    <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center text-xl mb-1 active:scale-95 transition-transform">
                        <i class="fa-solid fa-wallet"></i>
                    </div>
                    <span class="text-[11px] font-semibold text-gray-700">Top Up</span>
                </button>
                <button class="flex flex-col items-center">
                    <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center text-xl mb-1 active:scale-95 transition-transform">
                        <i class="fa-solid fa-grid-2 text-lg"></i>
                        <i class="fa-solid fa-shapes"></i>
                    </div>
                    <span class="text-[11px] font-semibold text-gray-700">Lainnya</span>
                </button>
            </div>
        </div>

        <!-- Riwayat Transaksi -->
        <div class="p-5">
            <h3 class="font-bold text-gray-800 text-sm mb-3">Transaksi Terakhir</h3>
            <div class="space-y-3">
                <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-gray-100 flex justify-between items-center">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-red-50 text-red-500 rounded-xl flex items-center justify-center">
                            <i class="fa-solid fa-arrow-up-right"></i>
                        </div>
                        <div>
                            <p class="text-xs font-bold text-gray-800">Transfer Bank BCA</p>
                            <p class="text-[10px] text-gray-400">Hari ini, 14:20</p>
                        </div>
                    </div>
                    <span class="text-xs font-bold text-red-500">- Rp 250.000</span>
                </div>
                <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-gray-100 flex justify-between items-center">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-green-50 text-green-500 rounded-xl flex items-center justify-center">
                            <i class="fa-solid fa-arrow-down-left"></i>
                        </div>
                        <div>
                            <p class="text-xs font-bold text-gray-800">Terima dari Bank Mandiri</p>
                            <p class="text-[10px] text-gray-400">Kemarin, 09:15</p>
                        </div>
                    </div>
                    <span class="text-xs font-bold text-green-600">+ Rp 1.500.000</span>
                </div>
            </div>
        </div>

        <!-- Bottom Navigation Bar -->
        <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-gray-100 px-6 py-2 flex justify-between items-center z-10">
            <button class="flex flex-col items-center text-blue-600">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-[10px] font-medium mt-1">Beranda</span>
            </button>
            <button class="flex flex-col items-center text-gray-400">
                <i class="fa-solid fa-clock-rotate-left text-lg"></i>
                <span class="text-[10px] font-medium mt-1">Riwayat</span>
            </button>
            <button class="flex flex-col items-center text-gray-400">
                <i class="fa-solid fa-user text-lg"></i>
                <span class="text-[10px] font-medium mt-1">Saya</span>
            </button>
        </div>
    </div>

    <!-- Modal Transfer Ke Bank -->
    <div id="transferModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center hidden">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 transition-all transform">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-gray-800 text-base">Transfer ke Bank</h3>
                <button onclick="closeTransferModal()" class="text-gray-400 hover:text-gray-600 text-xl">&times;</button>
            </div>

            <form onsubmit="simulasiTransfer(event)" class="space-y-4">
                <!-- Pilih Bank (Dengan Logo Internet / Clearbit CDN) -->
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-2">Pilih Bank Tujuan</label>
                    <div class="grid grid-cols-2 gap-2 max-h-40 overflow-y-auto p-1 border rounded-xl">
                        
                        <label class="flex items-center p-2.5 border rounded-xl cursor-pointer hover:bg-gray-50 space-x-2">
                            <input type="radio" name="bank" value="BCA" class="text-blue-600 focus:ring-0" required>
                            <img src="https://logo.clearbit.com/bca.co.id" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2830/2830284.png'" class="w-6 h-6 object-contain" alt="BCA">
                            <span class="text-xs font-semibold">Bank BCA</span>
                        </label>

                        <label class="flex items-center p-2.5 border rounded-xl cursor-pointer hover:bg-gray-50 space-x-2">
                            <input type="radio" name="bank" value="Mandiri" class="text-blue-600 focus:ring-0">
                            <img src="https://logo.clearbit.com/bankmandiri.co.id" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2830/2830284.png'" class="w-6 h-6 object-contain" alt="Mandiri">
                            <span class="text-xs font-semibold">Bank Mandiri</span>
                        </label>

                        <label class="flex items-center p-2.5 border rounded-xl cursor-pointer hover:bg-gray-50 space-x-2">
                            <input type="radio" name="bank" value="BRI" class="text-blue-600 focus:ring-0">
                            <img src="https://logo.clearbit.com/bri.co.id" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2830/2830284.png'" class="w-6 h-6 object-contain" alt="BRI">
                            <span class="text-xs font-semibold">Bank BRI</span>
                        </label>

                        <label class="flex items-center p-2.5 border rounded-xl cursor-pointer hover:bg-gray-50 space-x-2">
                            <input type="radio" name="bank" value="BNI" class="text-blue-600 focus:ring-0">
                            <img src="https://logo.clearbit.com/bni.co.id" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2830/2830284.png'" class="w-6 h-6 object-contain" alt="BNI">
                            <span class="text-xs font-semibold">Bank BNI</span>
                        </label>

                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Nomor Rekening</label>
                    <input type="number" placeholder="Contoh: 883012389" required class="w-full px-3.5 py-2.5 text-xs bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Nominal (Rp)</label>
                    <input type="number" placeholder="Min. 10.000" required min="10000" class="w-full px-3.5 py-2.5 text-xs bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-blue-500">
                </div>

                <button type="submit" class="w-full py-3 bg-blue-600 text-white font-bold text-xs rounded-xl shadow-blue-200 shadow-md hover:bg-blue-700 active:scale-[0.98]">
                    Kirim Sekarang
                </button>
            </form>
        </div>
    </div>

    <script>
        function openTransferModal() {
            document.getElementById('transferModal').classList.remove('hidden');
        }
        function closeTransferModal() {
            document.getElementById('transferModal').classList.add('hidden');
        }
        function simulasiTransfer(e) {
            e.preventDefault();
            alert("Simulasi Transfer Berhasil dikirim!");
            closeTransferModal();
        }
    </script>
</body>
</html>
