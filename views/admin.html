<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahut Bank - Panel Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen">
    <header class="bg-white border-b px-6 py-4 flex justify-between items-center sticky top-0 z-10">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded-lg overflow-hidden">
                <svg viewBox="0 0 100 100" class="w-full h-full">
                    <path d="M 20,20 Q 50,15 80,20 L 75,55 Q 50,85 20,55 Z" fill="#1d4ed8"/>
                    <path d="M 35,65 Q 55,80 75,30 Q 60,35 45,45 Q 35,55 35,65 Z" fill="#f97316"/>
                </svg>
            </div>
            <span class="font-bold text-gray-800 text-sm">Kahut Admin Dashboard</span>
        </div>
        <a href="/" class="text-xs text-red-600 font-bold">Keluar</a>
    </header>

    <div class="max-w-5xl mx-auto p-6 space-y-6">
        
        <!-- Daftar Member & Kontrol Saldo -->
        <div class="bg-white p-5 rounded-2xl border shadow-sm">
            <h2 class="font-bold text-gray-800 text-sm mb-4">Kelola Member & Saldo</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                    <thead class="bg-gray-50 text-gray-400 uppercase">
                        <tr>
                            <th class="p-3">Nama Member</th>
                            <th class="p-3">Nomor HP</th>
                            <th class="p-3">Saldo Saat Ini</th>
                            <th class="p-3 text-center">Aksi Saldo</th>
                        </tr>
                    </thead>
                    <tbody id="userTable" class="divide-y">
                        <!-- Data member dimuat otomatis -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Tabel Riwayat Semua Transaksi -->
        <div class="bg-white p-5 rounded-2xl border shadow-sm">
            <h2 class="font-bold text-gray-800 text-sm mb-4">Semua Log Transaksi System</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                    <thead class="bg-gray-50 text-gray-400 uppercase">
                        <tr>
                            <th class="p-3">ID Transaksi</th>
                            <th class="p-3">Pengirim</th>
                            <th class="p-3">Penerima</th>
                            <th class="p-3">Nominal</th>
                            <th class="p-3">Tipe</th>
                        </tr>
                    </thead>
                    <tbody id="txTable" class="divide-y">
                        <!-- Data transaksi dimuat otomatis -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        async function loadAdminData() {
            const res = await fetch('/api/admin/data');
            const data = await res.json();

            // Render Tabel Member
            document.getElementById('userTable').innerHTML = data.users.map(u => `
                <tr>
                    <td class="p-3 font-bold text-gray-800">${u.name}</td>
                    <td class="p-3 text-gray-500">${u.id}</td>
                    <td class="p-3 font-bold text-blue-600">Rp ${u.balance.toLocaleString('id-ID')}</td>
                    <td class="p-3 text-center space-x-1">
                        <button onclick="adjustBalance('${u.id}', 'ADD')" class="bg-green-100 text-green-700 px-2.5 py-1 rounded-lg font-bold hover:bg-green-200">+ Saldo</button>
                        <button onclick="adjustBalance('${u.id}', 'SUBTRACT')" class="bg-red-100 text-red-700 px-2.5 py-1 rounded-lg font-bold hover:bg-red-200">- Saldo</button>
                    </td>
                </tr>
            `).join('');

            // Render Tabel Transaksi
            document.getElementById('txTable').innerHTML = data.transactions.map(t => `
                <tr>
                    <td class="p-3 font-mono text-gray-400">${t.id}</td>
                    <td class="p-3 font-bold">${t.sender}</td>
                    <td class="p-3 text-gray-600">${t.recipient}</td>
                    <td class="p-3 font-bold text-gray-800">Rp ${t.amount.toLocaleString('id-ID')}</td>
                    <td class="p-3"><span class="bg-gray-100 px-2 py-0.5 rounded text-[10px] font-semibold">${t.type}</span></td>
                </tr>
            `).join('');
        }

        async function adjustBalance(userId, type) {
            const amount = prompt(`Masukkan nominal saldo yang ingin ${type === 'ADD' ? 'DITAMBAHKAN' : 'DIKURANGI'}:`);
            if(!amount || isNaN(amount)) return;

            const res = await fetch('/api/admin/adjust-balance', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId, type, amount })
            });

            const data = await res.json();
            alert(data.message);
            loadAdminData();
        }

        loadAdminData();
    </script>
</body>
</html>
